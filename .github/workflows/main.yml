# .github/workflows/docker-build.yml
name: Build and Push Multi-Arch Docker Images

on:
  push:
    branches:
      - master
  # Добавьте pull_request для тестирования, если нужно
  #  pull_request:
  #    branches:
  #      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Настройка QEMU для эмуляции разных архитектур (важно для сборки arm)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Настройка Docker Buildx с поддержкой нескольких платформ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Логин в GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Извлечение метаданных (тегов и лейблов) для образа
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 5. Сборка и публикация образов для трех платформ
      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          # Указываем платформы: x86_64, ARMv7, ARMv8 (64-bit)
          platforms: linux/amd64, linux/arm/v7, linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Используем кэш для ускорения сборки
          cache-from: type=gha
          cache-to: type=gha,mode=max
